name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate light and dark snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%2300D9C0&color_dots=%23EBEDF0,%23B9F5E8,%2368E0CF,%237C83FD,%23B05CFF
            dist/github-snake-dark.svg?color_snake=%237C83FD&color_dots=%230D1117,%230B3B45,%2300A99D,%237C83FD,%23E879F9

      - name: Publish snakes to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
